services:
  - type: web
    name: stress-detector-api
    env: python
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install --no-cache-dir -r requirements.txt
    startCommand: python StressDetector/src/main_fastapi.py
    envVars:
      - key: TF_CPP_MIN_LOG_LEVEL
        value: 3
      - key: TF_ENABLE_ONEDNN_OPTS
        value: 0
      - key: DURATION
        value: 10
      - key: SAMPLE_RATE
        value: 22050
      - key: MODEL_PATH
        value: models/modelo_deteccion_estres.keras
      - key: DATASET_PATH
        value: processed_dataset.npz
      - key: RECORDINGS_DIR
        value: recordings
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: PYTHONPATH
        value: StressDetector/src
